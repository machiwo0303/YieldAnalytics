name: Run JPX Screening Fetch

on:
  workflow_dispatch:  
  schedule:
    - cron: "10 21 * * 5"   # 毎週土曜 06:10 JST（金曜 21:10 UTC）

concurrency:
  group: yieldanalytics-pipeline
  cancel-in-progress: false
  
jobs:
  run-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run jpx_screening_fetch.py
        run: |
          python jpx_screening_fetch.py input/jpx_all.csv

      - name: Commit latest CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mv output_financial_dividend_merged.csv output/output_financial_dividend_merged.csv
          git add output/output_financial_dividend_merged.csv
          git commit -m "Update fetch output (auto)" || echo "No changes"
          git push
